<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UofSC Student Portal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="portal-layout">
    <aside class="sidebar">
      <button class="brand" data-page="home" aria-label="Go to homepage">
        <div class="brand-mark">SC</div>
        <div>
          <p class="university-name">UNIVERSITY OF SOUTH CAROLINA</p>
          <h1>Student Portal</h1>
        </div>
      </button>

      <nav class="navigation">
        <p class="nav-label">STUDENT RESOURCES</p>

        <button class="nav-button" data-page="majors">
          <span class="nav-icon">◆</span>
          Majors and Degrees
        </button>

        <button class="nav-button" data-page="organizations">
          <span class="nav-icon">★</span>
          Organizations
        </button>

        <button class="nav-button" data-page="dining">
          <span class="nav-icon">●</span>
          Dining Halls
        </button>
      </nav>

      <div class="sidebar-footer">
        <p>Forever to Thee.</p>
      </div>
    </aside>

    <main class="main-content">
      <header class="top-bar">
        <div>
          <p class="eyebrow">UNIVERSITY OF SOUTH CAROLINA</p>
          <h2 id="page-title">Welcome, Gamecock!</h2>
        </div>

        <div class="gamecock-badge">
          <span>GO</span>
          <strong>GAMECOCKS</strong>
        </div>
      </header>

      <section id="page-content">
        <!-- JavaScript adds page content here -->
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
