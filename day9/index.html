<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carolina Game Day Checklist</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Carolina Game Day Checklist</h1>
    </header>

    <main>
      <section class="checklist-card">
        <h2>Add an item to your bag:</h2>

        <div class="entry-row">
          <input
            id="item-input"
            type="text"
            placeholder="Type an item..."
          />

          <button id="add-button" type="button">Add to List</button>
        </div>
      </section>

      <section class="list-section">
        <h2>Game Day Essentials</h2>

        <ul id="checklist">
          <li>Wear garnet and black</li>
          <li>Bring Carolina Card</li>
          <li>Hydrate!</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
