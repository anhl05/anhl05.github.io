<!DOCTYPE html>
<!--
rework this code to represent a bank account
it should have 2 buttons, one to deposit and one to withdraw

in the javascript, create 2 functions, one to deposit and one to withdraw
-->
<html>
    <head>
        <title>Bank Account</title>
        <link rel="stylesheet" href="style.css">
    </head> 
    <body>
        <div id="player-card">
            <h2>Deposit Money</h2>

            <p>Deposit: <span id="money-display">$0</span></p>
            <p id="status-message">Money Safe!</p>

            <button onclick="depositMoney()">Deposit $100</button>
        </div>

        <div id="player-card">
            <h3>Withdraw Money</h3>

            <p>Withdraw: <span id="money-display">$1000</span></p>
            <p id="status-message">Instant Money!</p>

            <button onclick="withdrawMoney()">Withdraw $100</button>
        </div>
        
        <script src="script.js"></script>
    </body>
</html>
